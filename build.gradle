plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// version and group come from gradle.properties (version=1.2.0)
base {
	archivesName = "mineberry-essentials"
}

loom {
	accessWidenerPath = file('src/main/resources/mineberry-essentials.accesswidener')
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// WorldEditCUI protocol library
	maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WorldEditCUI protocol library, bundled as jar-in-jar
	implementation "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-common-mc26.2:${project.cui_protocol_version}"
	implementation "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-fabric-mc26.2:${project.cui_protocol_version}"
	// Both jars must be bundled: CUIPacket lives in "common", the Fabric entrypoint in "fabric".
	include "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-common-mc26.2:${project.cui_protocol_version}"
	include "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-fabric-mc26.2:${project.cui_protocol_version}"

	// Mod Menu (compile-time only; optional at runtime)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}